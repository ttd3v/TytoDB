name: Testing

on: 
  push:
    branches: [ "master" ]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  testing:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Nightly Toolchain
      run: |
        rustup toolchain install nightly
        rustup default nightly
        
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"

    - name: Install liburing-dev
      run: sudo apt-get update && sudo apt-get install -y liburing-dev

    - name: Run database and then run testing program
      run: |
        # Clone the testing repository
        git clone https://github.com/FeatheredSystems/TytoDB-Testing ~/testing-program

        # Start the database in the background
        RUST_BACKTRACE=full cargo run --release &
        DB_PID=$!

        # Wait for database to be ready
        echo "Waiting for database to start..."
        for i in {1..30}; do
          if nc -z localhost 4287; then
            echo "Database is ready!"
            break
          fi
          echo "Attempt $i/30: Waiting for DB to start..."
          sleep 5
        done

        # Verify database is still running
        if ! kill -0 $DB_PID 2>/dev/null; then
          echo "ERROR: Database process has died!"
          exit 1
        fi

        # Give database a moment to fully initialize
        sleep 5

        # Run the testing program
        echo "Starting test suite..."
        cd ~/testing-program
        
        # Run tests and capture exit code
        if time cargo run --release; then
          echo "Tests completed successfully"
          TEST_EXIT_CODE=0
        else
          echo "Tests failed"
          TEST_EXIT_CODE=1
        fi

        # Stop the database gracefully
        echo "Shutting down database..."
        if kill -0 $DB_PID 2>/dev/null; then
          kill $DB_PID
          # Wait for graceful shutdown
          sleep 5
          # Force kill if still running
          kill -9 $DB_PID 2>/dev/null || true
        fi

        # Exit with test result
        exit $TEST_EXIT_CODE
