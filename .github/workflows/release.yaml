name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Job 1: Run tests (always runs first)
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install liburing-dev
      run: sudo apt-get update && sudo apt-get install -y liburing-dev
    
    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      id: tests
      run: |
        if cargo test --verbose > test_output.txt 2>&1; then
          echo "tests_passed=true" >> $GITHUB_OUTPUT
        else
          echo "tests_passed=false" >> $GITHUB_OUTPUT
          cat test_output.txt
          exit 1
        fi
        cat test_output.txt
    
    # Send Discord notification (optional)
    - name: Send Discord notification (Success)
      if: success() && steps.tests.outputs.tests_passed == 'true' && env.DISCORD_WEBHOOK_URL != ''
      run: |
        curl -H "Content-Type: application/json" \
             -d '{
               "embeds": [{
                 "title": "✅ Tests Passed",
                 "description": "All tests passed for `'${{ github.repository }}'`",
                 "color": 65280,
                 "fields": [
                   {"name": "Branch", "value": "'${{ github.ref_name }}'", "inline": true},
                   {"name": "Author", "value": "'${{ github.actor }}'", "inline": true}
                 ]
               }]
             }' \
             ${{ secrets.DISCORD_WEBHOOK_URL }}
    
    - name: Send Discord notification (Failure)
      if: failure() && env.DISCORD_WEBHOOK_URL != ''
      run: |
        curl -H "Content-Type: application/json" \
             -d '{
               "embeds": [{
                 "title": "❌ Tests Failed",
                 "description": "Tests failed for `'${{ github.repository }}'`",
                 "color": 16711680,
                 "fields": [
                   {"name": "Branch", "value": "'${{ github.ref_name }}'", "inline": true},
                   {"name": "Author", "value": "'${{ github.actor }}'", "inline": true}
                 ]
               }]
             }' \
             ${{ secrets.DISCORD_WEBHOOK_URL }}
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  # Job 2: Build x86_64 release (native build)
  build-x86_64:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y liburing-dev
      
      - name: Build x86_64
        run: cargo build --release
        
      - name: Package x86_64
        run: tar -czf tytodb-x86_64-linux.tar.gz -C target/release tytodb
        
      - name: Upload x86_64 to release
        uses: softprops/action-gh-release@v2
        with:
          files: tytodb-x86_64-linux.tar.gz

  # Job 3: Build ARM64 release (using bare cargo with cross-compilation)
  build-arm64:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cross-compilation toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config
          # Add arm64 architecture and install arm64 version of liburing-dev
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y liburing-dev:arm64
      
      - name: Add ARM64 target
        run: rustup target add aarch64-unknown-linux-gnu
        
      - name: Create Cargo config for cross-compilation
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          
          [env]
          PKG_CONFIG_ALLOW_CROSS = "1"
          PKG_CONFIG_PATH_aarch64-unknown-linux-gnu = "/usr/lib/aarch64-linux-gnu/pkgconfig"
          EOF
          
      - name: Build ARM64
        run: cargo build --release --target aarch64-unknown-linux-gnu
          
      - name: Package ARM64
        run: tar -czf tytodb-arm64-linux.tar.gz -C target/aarch64-unknown-linux-gnu/release tytodb
        
      - name: Upload ARM64 to release
        uses: softprops/action-gh-release@v2
        with:
          files: tytodb-arm64-linux.tar.gz
        
      # Send build success notification for ARM64
      - name: Send Discord build notification (ARM64 Success)
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "🚀 ARM64 Release Built",
                   "description": "Binary `tytodb-arm64-linux.tar.gz` built and uploaded for release `'${{ github.event.release.tag_name }}'`",
                   "color": 3447003,
                   "fields": [
                     {"name": "Target", "value": "aarch64-unknown-linux-gnu", "inline": true},
                     {"name": "Release", "value": "'${{ github.event.release.tag_name }}'", "inline": true}
                   ]
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  # Send build success notification for x86_64 (moved to separate job)
  notify-x86_64:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord build notification (x86_64 Success)
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "🚀 x86_64 Release Built",
                   "description": "Binary `tytodb-x86_64-linux.tar.gz` built and uploaded for release `'${{ github.event.release.tag_name }}'`",
                   "color": 3447003,
                   "fields": [
                     {"name": "Target", "value": "x86_64-unknown-linux-gnu", "inline": true},
                     {"name": "Release", "value": "'${{ github.event.release.tag_name }}'", "inline": true}
                   ]
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}