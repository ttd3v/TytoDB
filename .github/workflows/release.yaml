name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Job 1: Run tests (always runs first)
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      run: |
        git clone https://github.com/${{ github.repository }}.git .
        git checkout ${{ github.sha }}
    
    - name: Install liburing-dev
      run: sudo apt-get update && sudo apt-get install -y liburing-dev
    
    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      id: tests
      run: |
        if cargo test --verbose > test_output.txt 2>&1; then
          echo "tests_passed=true" >> $GITHUB_OUTPUT
        else
          echo "tests_passed=false" >> $GITHUB_OUTPUT
          cat test_output.txt
          exit 1
        fi
        cat test_output.txt
    
    # Send Discord notification (optional)
    - name: Send Discord notification (Success)
      if: success() && steps.tests.outputs.tests_passed == 'true' && env.DISCORD_WEBHOOK_URL != ''
      run: |
        curl -H "Content-Type: application/json" \
             -d '{
               "embeds": [{
                 "title": "✅ Tests Passed",
                 "description": "All tests passed for `'${{ github.repository }}'`",
                 "color": 65280,
                 "fields": [
                   {"name": "Branch", "value": "'${{ github.ref_name }}'", "inline": true},
                   {"name": "Author", "value": "'${{ github.actor }}'", "inline": true}
                 ]
               }]
             }' \
             ${{ secrets.DISCORD_WEBHOOK_URL }}
    
    - name: Send Discord notification (Failure)
      if: failure() && env.DISCORD_WEBHOOK_URL != ''
      run: |
        curl -H "Content-Type: application/json" \
             -d '{
               "embeds": [{
                 "title": "❌ Tests Failed",
                 "description": "Tests failed for `'${{ github.repository }}'`",
                 "color": 16711680,
                 "fields": [
                   {"name": "Branch", "value": "'${{ github.ref_name }}'", "inline": true},
                   {"name": "Author", "value": "'${{ github.actor }}'", "inline": true}
                 ]
               }]
             }' \
             ${{ secrets.DISCORD_WEBHOOK_URL }}
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  # Matrix job: Build releases for multiple targets
  build-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: 
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            gcc_package: ""
            cross_compiler: ""
            native: true
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            gcc_package: gcc-aarch64-linux-gnu
            cross_compiler: aarch64-linux-gnu-gcc
            native: false
    
    steps:
      - name: Checkout code
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}
      
      - name: Install dependencies (native)
        if: matrix.target.native == true
        run: sudo apt-get update && sudo apt-get install -y liburing-dev
      
      - name: Install cross-compilation dependencies
        if: matrix.target.native == false
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.target.gcc_package }} pkg-config
          # Add architecture and install cross-compiled libraries
          sudo dpkg --add-architecture ${{ matrix.target.arch }}
          sudo apt-get update
          sudo apt-get install -y liburing-dev:${{ matrix.target.arch }}
      
      - name: Add Rust target
        if: matrix.target.native == false
        run: rustup target add ${{ matrix.target.rust_target }}
        
      - name: Create Cargo config for cross-compilation
        if: matrix.target.native == false
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.${{ matrix.target.rust_target }}]
          linker = "${{ matrix.target.cross_compiler }}"
          
          [env]
          PKG_CONFIG_ALLOW_CROSS = "1"
          PKG_CONFIG_PATH_${{ matrix.target.rust_target | replace("-", "_") }} = "/usr/lib/${{ matrix.target.rust_target }}/pkgconfig"
          EOF
      
      - name: Build native
        if: matrix.target.native == true
        run: cargo build --release
      
      - name: Build cross-compiled
        if: matrix.target.native == false
        run: cargo build --release --target ${{ matrix.target.rust_target }}
        
      - name: Package binary (native)
        if: matrix.target.native == true
        run: tar -czf tytodb-${{ matrix.target.arch }}-linux.tar.gz -C target/release tytodb
        
      - name: Package binary (cross-compiled)
        if: matrix.target.native == false
        run: tar -czf tytodb-${{ matrix.target.arch }}-linux.tar.gz -C target/${{ matrix.target.rust_target }}/release tytodb
        
      - name: Upload to release
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets?name=tytodb-${{ matrix.target.arch }}-linux.tar.gz" \
            --data-binary "@tytodb-${{ matrix.target.arch }}-linux.tar.gz"
        
      # Send build success notification
      - name: Send Discord build notification (Success)
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "🚀 ${{ matrix.target.arch }} Release Built",
                   "description": "Binary `tytodb-${{ matrix.target.arch }}-linux.tar.gz` built and uploaded for release `'${{ github.event.release.tag_name }}'`",
                   "color": 3447003,
                   "fields": [
                     {"name": "Target", "value": "${{ matrix.target.rust_target }}", "inline": true},
                     {"name": "Release", "value": "'${{ github.event.release.tag_name }}'", "inline": true}
                   ]
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}