# .github/workflows/release.yml
name: Build and Publish TytoDB

on:
  release:
    types: [published]

jobs:
  # Job for building all Linux targets
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu    # 64-bit Intel/AMD
          - aarch64-unknown-linux-gnu   # 64-bit ARM
          - armv7-unknown-linux-gnueabihf # 32-bit ARM
          - i686-unknown-linux-gnu      # 32-bit Intel/AMD
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true

      - name: Install cross
        run: cargo install cross

      - name: Create Cross.toml for Linux dependencies
        run: |
          cat <<EOF > Cross.toml
          [target.aarch64-unknown-linux-gnu]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          [target.x86_64-unknown-linux-gnu]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          [target.armv7-unknown-linux-gnueabihf]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          [target.i686-unknown-linux-gnu]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          EOF

      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package the binary
        run: |
          # Create a directory for packaging
          mkdir -p dist
          # Copy the binary into it
          cp target/${{ matrix.target }}/release/tytodb dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tytodb-binary-${{ matrix.target }}
          path: dist/

  # This job runs only after the Linux builds are successful
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-linux] # Now only depends on the build-linux job
    permissions:
      contents: write # Required to upload assets to a release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets by zipping them
        run: |
          # The download-artifact action creates subdirectories for each artifact.
          # We loop through them and create a zip file for each one.
          for dir in artifacts/*; do
            if [ -d "$dir" ]; then
              asset_name=$(basename "$dir")
              (cd "$dir" && zip -r "../${asset_name}.zip" .)
            fi
          done
        
      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          # This uploads all the .zip files we just created
          files: artifacts/*.zip```