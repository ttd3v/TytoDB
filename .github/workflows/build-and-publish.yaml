# .github/workflows/release.yml
name: Build and Publish TytoDB

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          # --- Common Linux Architectures ---
          - x86_64-unknown-linux-gnu    # 64-bit Intel/AMD (Standard)
          - aarch64-unknown-linux-gnu   # 64-bit ARM (e.g., Raspberry Pi 4, AWS Graviton)
          - armv7-unknown-linux-gnueabihf # 32-bit ARM with hard-float (e.g., Raspberry Pi 2/3)
          - i686-unknown-linux-gnu      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true

      - name: Install cross
        run: cargo install cross

      # ---- START: ADDED STEP ----
      - name: Create Cross.toml to install build dependencies
        run: |
          cat <<EOF > Cross.toml
          # This file is dynamically generated by the workflow
          # to install system dependencies required for the build.

          [target.aarch64-unknown-linux-gnu]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]

          [target.x86_64-unknown-linux-gnu]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          EOF
      # ---- END: ADDED STEP ----

      - name: Build TytoDB
        run: cross build --release --target ${{ matrix.target }}

      - name: Package the binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tytodb dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tytodb-binary-${{ matrix.target }}
          path: dist/