# .github/workflows/release.yml
name: Build and Publish TytoDB

on:
  release:
    types: [published]

jobs:
  # Job for building all Linux targets
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - i686-unknown-linux-gnu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- THIS IS THE CORRECTED STEP ---
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true
      # --- END CORRECTION ---

      - name: Install cross
        run: cargo install cross

      - name: Create Cross.toml for Linux dependencies
        run: |
          cat <<EOF > Cross.toml
          [target.aarch64-unknown-linux-gnu]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          [target.x86_64-unknown-linux-gnu]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          [target.armv7-unknown-linux-gnueabihf]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          [target.i686-unknown-linux-gnu]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          EOF

      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package the binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tytodb dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tytodb-binary-${{ matrix.target }}
          path: dist/

  # This job runs only after the Linux builds are successful
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-linux]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets by zipping them
        run: |
          for dir in artifacts/*; do
            if [ -d "$dir" ]; then
              asset_name=$(basename "$dir")
              (cd "$dir" && zip -r "../${asset_name}.zip" .)
            fi
          done
        
      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip