name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"

    - name: Install liburing-dev
      run: sudo apt-get update && sudo apt-get install -y liburing-dev

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: |
        cargo test --verbose 2>&1 | tee test_output.txt

    - name: Send Discord notification (Success)
      if: success() && vars.DISCORD_WEBHOOK_URL != ''
      run: |
        curl -H "Content-Type: application/json" \
             -d '{
               "embeds": [{
                 "title": "✅ Tests Passed",
                 "description": "All tests passed successfully for `${{ github.repository }}`",
                 "color": 65280,
                 "fields": [
                   { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true },
                   { "name": "Commit", "value": "[${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})", "inline": true },
                   { "name": "Author", "value": "${{ github.actor }}", "inline": true }
                 ],
                 "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
               }]
             }' \
             ${{ secrets.DISCORD_WEBHOOK_URL }}

    - name: Send Discord notification (Failure)
      if: failure()
      run: |
        tail -20 test_output.txt > short_output.txt 2>/dev/null || echo "No test output available" > short_output.txt
        TEST_OUTPUT=$(cat short_output.txt | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
        curl -H "Content-Type: application/json" \
             -d '{
               "embeds": [{
                 "title": "❌ Tests Failed",
                 "description": "Tests failed for `${{ github.repository }}`",
                 "color": 16711680,
                 "fields": [
                   { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true },
                   { "name": "Commit", "value": "[${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})", "inline": true },
                   { "name": "Author", "value": "${{ github.actor }}", "inline": true },
                   { "name": "Error Output", "value": "```\n'"$TEST_OUTPUT"'\n```" }
                 ],
                 "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
               }]
             }' \
             ${{ secrets.DISCORD_WEBHOOK_URL }}

  build-cross-image:
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write custom Dockerfile
        run: |
            cat <<'EOF' > cross.Dockerfile
            FROM ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5
            RUN dpkg --add-architecture arm64 && \
                    apt-get update && \
                    apt-get install -y \
                      git \
                      build-essential \
                      pkg-config \
                      autoconf \
                      automake \
                      libtool \
                      curl \
                      wget \
                      linux-libc-dev:arm64
            
            RUN git clone --depth 1 --branch liburing-2.3 https://github.com/axboe/liburing.git && \
              cd liburing && \
              rm -rf test && \ # Added this line
              export CC=aarch64-linux-gnu-gcc && \
              export CXX=aarch64-linux-gnu-g++ && \
              export AR=aarch64-linux-gnu-ar && \
              export RANLIB=aarch64-linux-gnu-ranlib && \
              export CFLAGS="-fPIC" && \
              ./configure --prefix=/usr/aarch64-linux-gnu && \
              make -j$(nproc) && \
              make install_headers install_libs && \
              cd विभाष && \
              rm -rf liburing
            
            ENV PKG_CONFIG_ALLOW_CROSS=1
            ENV PKG_CONFIG_PATH="/usr/aarch64-linux-gnu/lib/pkgconfig"
            ENV PKG_CONFIG_SYSROOT_DIR="/usr/aarch64-linux-gnu"
            ENV SYSROOT="/usr/aarch64-linux-gnu"
            
            ENV CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="aarch64-linux-gnu-gcc"
            ENV CC_aarch64_unknown_linux_gnu="aarch64-linux-gnu-gcc"
            ENV CXX_aarch64_unknown_linux_gnu="aarch64-linux-gnu-g++"
            ENV AR_aarch64_unknown_linux_gnu="aarch64-linux-gnu-ar"
            ENV STRIP_aarch64_unknown_linux_gnu="aarch64-linux-gnu-strip"
            ENV RANLIB_aarch64_unknown_linux_gnu="aarch64-linux-gnu-ranlib"
            
            ENV CFLAGS_aarch64_unknown_linux_gnu="-I/usr/aarch64-linux-gnu/include -fPIC"
            ENV CXXFLAGS_aarch64_unknown_linux_gnu="-I/usr/aarch64-linux-gnu/include -fPIC"
            ENV LDFLAGS_aarch64_unknown_linux_gnu="-L/usr/aarch64-linux-gnu/lib"
            ENV RUSTFLAGS_aarch64_unknown_linux_gnu="-C link-arg=-Wl,-rpath-link,/usr/aarch64-linux-gnu/lib"
            
            RUN PKG_CONFIG_PATH=/usr/aarch64-linux-gnu/lib/pkgconfig pkg-config --exists liburing && \
                PKG_CONFIG_PATH=/usr/aarch64-linux-gnu/lib/pkgconfig pkg-config --cflags --libs liburing
            EOF

      - name: Build and tag custom image
        id: meta
        run: |
          docker build -t cross-aarch64-liburing -f cross.Dockerfile .
          echo "image=cross-aarch64-liburing" >> $GITHUB_OUTPUT
        
  test-build:
    if: github.event_name != 'release'
    needs: [test, build-cross-image]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            native: true
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            native: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install dependencies (x86_64 native)
        if: matrix.target.native == true
        run: sudo apt-get update && sudo apt-get install -y liburing-dev

      - name: Install cross (for arm64)
        if: matrix.target.native == false
        run: cargo install cross --version 0.2.5

      - name: Build (x86_64 native)
        if: matrix.target.native == true
        run: cargo build --release

      - name: Configure and Build (arm64 cross)
        if: matrix.target.native == false
        run: |
          # Create Cross.toml configuration
          cat <<'EOF' > Cross.toml
          [build]
          default-target = "aarch64-unknown-linux-gnu"
          
          [target.aarch64-unknown-linux-gnu]
          dockerfile = "./cross.Dockerfile"
          image = "${{ needs.build-cross-image.outputs.image }}"
          
          [target.aarch64-unknown-linux-gnu.env]
          passthrough = [
              "PKG_CONFIG_ALLOW_CROSS",
              "PKG_CONFIG_PATH",
              "PKG_CONFIG_SYSROOT_DIR",
              "SYSROOT"
          ]
          EOF
          
          # Create .cargo/config.toml for proper linking
          mkdir -p .cargo
          cat <<'EOF' > .cargo/config.toml
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          rustflags = [
            "-C", "link-arg=-Wl,-rpath-link,/usr/aarch64-linux-gnu/lib",
            "-C", "target-feature=+crt-static"
          ]
          
          [env]
          PKG_CONFIG_ALLOW_CROSS = { value = "1", relative = false }
          PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu = { value = "/usr/aarch64-linux-gnu", relative = false }
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu = { value = "/usr/aarch64-linux-gnu/lib/pkgconfig", relative = false }
          EOF
          
          # Build with cross using the custom image
          cross build --release --target ${{ matrix.target.rust_target }}

      - name: Send Discord build notification (Success)
        if: success() && vars.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "🔨 ${{ matrix.target.arch }} Test Build Complete",
                   "description": "Test build successful for `${{ github.repository }}` on `${{ github.ref_name }}`",
                   "color": 3447003,
                   "fields": [
                     {"name": "Target", "value": "${{ matrix.target.rust_target }}", "inline": true},
                     {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                     {"name": "Author", "value": "${{ github.actor }}", "inline": true}
                   ],
                   "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send Discord build notification (Failure)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "💥 ${{ matrix.target.arch }} Test Build Failed",
                   "description": "Test build failed for `${{ github.repository }}` on `${{ github.ref_name }}`",
                   "color": 16711680,
                   "fields": [
                     {"name": "Target", "value": "${{ matrix.target.rust_target }}", "inline": true},
                     {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                     {"name": "Author", "value": "${{ github.actor }}", "inline": true}
                   ],
                   "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

  build-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [test, build-cross-image]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            native: true
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            native: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies (x86_64 native)
        if: matrix.target.native == true
        run: sudo apt-get update && sudo apt-get install -y liburing-dev

      - name: Install cross (for arm64)
        if: matrix.target.native == false
        run: cargo install cross --version 0.2.5

      - name: Build (x86_64 native)
        if: matrix.target.native == true
        run: cargo build --release

      - name: Configure and Build (arm64 cross)
        if: matrix.target.native == false
        run: |
          # Create Cross.toml configuration
          cat <<'EOF' > Cross.toml
          [build]
          default-target = "aarch64-unknown-linux-gnu"
          
          [target.aarch64-unknown-linux-gnu]
          dockerfile = "./cross.Dockerfile"
          image = "${{ needs.build-cross-image.outputs.image }}"
          
          [target.aarch64-unknown-linux-gnu.env]
          passthrough = [
              "PKG_CONFIG_ALLOW_CROSS",
              "PKG_CONFIG_PATH",
              "PKG_CONFIG_SYSROOT_DIR",
              "SYSROOT"
          ]
          EOF
          
          # Create .cargo/config.toml for proper linking
          mkdir -p .cargo
          cat <<'EOF' > .cargo/config.toml
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          rustflags = [
            "-C", "link-arg=-Wl,-rpath-link,/usr/aarch64-linux-gnu/lib",
            "-C", "target-feature=+crt-static"
          ]
          
          [env]
          PKG_CONFIG_ALLOW_CROSS = { value = "1", relative = false }
          PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu = { value = "/usr/aarch64-linux-gnu", relative = false }
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu = { value = "/usr/aarch64-linux-gnu/lib/pkgconfig", relative = false }
          EOF
          
          # Build with cross using the custom image
          cross build --release --target ${{ matrix.target.rust_target }}

      - name: Package binary (native)
        if: matrix.target.native == true
        run: tar -czf tyto-db-${{ matrix.target.arch }}-linux.tar.gz -C target/release tyto-db

      - name: Package binary (cross-compiled)
        if: matrix.target.native == false
        run: tar -czf tyto-db-${{ matrix.target.arch }}-linux.tar.gz -C target/${{ matrix.target.rust_target }}/release tyto-db

      - name: Upload to release
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets?name=tyto-db-${{ matrix.target.arch }}-linux.tar.gz" \
            --data-binary "@tyto-db-${{ matrix.target.arch }}-linux.tar.gz"

      - name: Send Discord build notification (Success)
        if: success() && vars.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "🚀 ${{ matrix.target.arch }} Release Built",
                   "description": "Binary `tyto-db-${{ matrix.target.arch }}-linux.tar.gz` built and uploaded for release `${{ github.event.release.tag_name }}`",
                   "color": 3447003,
                   "fields": [
                     {"name": "Target", "value": "${{ matrix.target.rust_target }}", "inline": true},
                     {"name": "Release", "value": "${{ github.event.release.tag_name }}", "inline": true}
                   ],
                   "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send Discord build notification (Failure)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "💥 ${{ matrix.target.arch }} Build Failed",
                   "description": "Failed to build binary for release `${{ github.event.release.tag_name }}`",
                   "color": 16711680,
                   "fields": [
                     {"name": "Target", "value": "${{ matrix.target.rust_target }}", "inline": true},
                     {"name": "Release", "value": "${{ github.event.release.tag_name }}", "inline": true}
                   ],
                   "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}