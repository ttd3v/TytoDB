name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Job 1: Run tests (always runs first)
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install liburing-dev
      run: sudo apt-get update && sudo apt-get install -y liburing-dev
    
    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      id: tests
      run: |
        # Run tests and capture output
        if cargo test --verbose > test_output.txt 2>&1; then
          echo "tests_passed=true" >> $GITHUB_OUTPUT
        else
          echo "tests_passed=false" >> $GITHUB_OUTPUT
        fi
        # Display the output
        cat test_output.txt
    
    # Send success notification
    - name: Send Discord notification (Success)
      if: success() && steps.tests.outputs.tests_passed == 'true' && vars.DISCORD_WEBHOOK_URL != ''
      run: |
        curl -H "Content-Type: application/json" \
             -d '{
               "embeds": [{
                 "title": "✅ Tests Passed",
                 "description": "All tests passed successfully for `${{ github.repository }}`",
                 "color": 65280,
                 "fields": [
                   {
                     "name": "Branch",
                     "value": "${{ github.ref_name }}",
                     "inline": true
                   },
                   {
                     "name": "Commit",
                     "value": "[${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})",
                     "inline": true
                   },
                   {
                     "name": "Author",
                     "value": "${{ github.actor }}",
                     "inline": true
                   }
                 ],
                 "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
               }]
             }' \
             ${{ secrets.DISCORD_WEBHOOK_URL }}
    
    # Send failure notification
    - name: Send Discord notification (Failure)
      if: failure() || steps.tests.outputs.tests_passed == 'false'
      run: |
        # Get the last few lines of test output for the notification
        tail -20 test_output.txt > short_output.txt 2>/dev/null || echo "No test output available" > short_output.txt
        TEST_OUTPUT=$(cat short_output.txt | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
        
        curl -H "Content-Type: application/json" \
             -d '{
               "embeds": [{
                 "title": "❌ Tests Failed",
                 "description": "Tests failed for `${{ github.repository }}`",
                 "color": 16711680,
                 "fields": [
                   {
                     "name": "Branch",
                     "value": "${{ github.ref_name }}",
                     "inline": true
                   },
                   {
                     "name": "Commit",
                     "value": "[${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})",
                     "inline": true
                   },
                   {
                     "name": "Author",
                     "value": "${{ github.actor }}",
                     "inline": true
                   },
                   {
                     "name": "Error Output",
                     "value": "```\n'"$TEST_OUTPUT"'\n```"
                   }
                 ],
                 "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
               }]
             }' \
             ${{ secrets.DISCORD_WEBHOOK_URL }}

  # Matrix job: Build releases for multiple targets (only on release)
  build-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: 
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            gcc_package: ""
            cross_compiler: ""
            native: true
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            gcc_package: gcc-aarch64-linux-gnu
            cross_compiler: aarch64-linux-gnu-gcc
            native: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies (native)
        if: matrix.target.native == true
        run: sudo apt-get update && sudo apt-get install -y liburing-dev
      
      - name: Install cross-compilation dependencies
        if: matrix.target.native == false
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.target.gcc_package }} pkg-config
          # Add architecture and install cross-compiled libraries
          sudo dpkg --add-architecture ${{ matrix.target.arch }}
          sudo apt-get update
          sudo apt-get install -y liburing-dev:${{ matrix.target.arch }}
      
      - name: Add Rust target
        if: matrix.target.native == false
        run: rustup target add ${{ matrix.target.rust_target }}
        
      - name: Create Cargo config for cross-compilation
        if: matrix.target.native == false
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.${{ matrix.target.rust_target }}]
          linker = "${{ matrix.target.cross_compiler }}"
          
          [env]
          PKG_CONFIG_ALLOW_CROSS = "1"
          PKG_CONFIG_PATH_${{ matrix.target.rust_target | replace("-", "_") }} = "/usr/lib/${{ matrix.target.rust_target }}/pkgconfig"
          EOF
      
      - name: Build native
        if: matrix.target.native == true
        run: cargo build --release
      
      - name: Build cross-compiled
        if: matrix.target.native == false
        run: cargo build --release --target ${{ matrix.target.rust_target }}
        
      - name: Package binary (native)
        if: matrix.target.native == true
        run: tar -czf tyto-db-${{ matrix.target.arch }}-linux.tar.gz -C target/release tyto-db
        
      - name: Package binary (cross-compiled)
        if: matrix.target.native == false
        run: tar -czf tyto-db-${{ matrix.target.arch }}-linux.tar.gz -C target/${{ matrix.target.rust_target }}/release tyto-db
        
      - name: Upload to release
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets?name=tyto-db-${{ matrix.target.arch }}-linux.tar.gz" \
            --data-binary "@tyto-db-${{ matrix.target.arch }}-linux.tar.gz"
        
      # Send build success notification
      - name: Send Discord build notification (Success)
        if: success() && vars.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "🚀 ${{ matrix.target.arch }} Release Built",
                   "description": "Binary `tyto-db-${{ matrix.target.arch }}-linux.tar.gz` built and uploaded for release `${{ github.event.release.tag_name }}`",
                   "color": 3447003,
                   "fields": [
                     {"name": "Target", "value": "${{ matrix.target.rust_target }}", "inline": true},
                     {"name": "Release", "value": "${{ github.event.release.tag_name }}", "inline": true}
                   ],
                   "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
      
      # Send build failure notification
      - name: Send Discord build notification (Failure)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "💥 ${{ matrix.target.arch }} Build Failed",
                   "description": "Failed to build binary for release `${{ github.event.release.tag_name }}`",
                   "color": 16711680,
                   "fields": [
                     {"name": "Target", "value": "${{ matrix.target.rust_target }}", "inline": true},
                     {"name": "Release", "value": "${{ github.event.release.tag_name }}", "inline": true}
                   ],
                   "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}