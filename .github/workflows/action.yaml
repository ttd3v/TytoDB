name: CI/CD Pipeline

on: 
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [published]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Nightly Toolchain
      run: |
        rustup toolchain install nightly
        rustup default nightly

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"

    - name: Install liburing-dev
      run: sudo apt-get update && sudo apt-get install -y liburing-dev && cd ~ && git clone https://github.com/axboe/liburing && cd liburing && ./configure && make && sudo make install


    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: |
        cargo test --verbose 2>&1 | tee test_output.txt

    - name: Send Discord notification (Success)
      if: success() && env.DISCORD_WEBHOOK_URL != ''
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        curl -H "Content-Type: application/json" \
             -d '{
               "embeds": [{
                 "title": "✅ Tests Passed",
                 "description": "All tests passed successfully for `${{ github.repository }}`",
                 "color": 65280,
                 "fields": [
                   { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true },
                   { "name": "Commit", "value": "[${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})", "inline": true },
                   { "name": "Author", "value": "${{ github.actor }}", "inline": true }
                 ],
                 "timestamp": "'""$(date -u +%Y-%m-%dT%H:%M:%S.000Z)""'"
               }]
             }' \
             ${{ secrets.DISCORD_WEBHOOK_URL }}

    - name: Send Discord notification (Failure)
      if: failure() && env.DISCORD_WEBHOOK_URL != ''
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        tail -20 test_output.txt > short_output.txt 2>/dev/null || echo "No test output available" > short_output.txt
        TEST_OUTPUT=$(cat short_output.txt | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
        curl -H "Content-Type: application/json" \
             -d '{
               "embeds": [{
                 "title": "❌ Tests Failed",
                 "description": "Tests failed for `${{ github.repository }}`",
                 "color": 16711680,
                 "fields": [
                   { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true },
                   { "name": "Commit", "value": "[${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})", "inline": true },
                   { "name": "Author", "value": "${{ github.actor }}", "inline": true },
                   { "name": "Error Output", "value": "```\n'""$TEST_OUTPUT""'\n```" }
                 ],
                 "timestamp": "'""$(date -u +%Y-%m-%dT%H:%M:%S.000Z)""'"
               }]
             }' \
             ${{ secrets.DISCORD_WEBHOOK_URL }}

  test-build:
    if: github.event_name != 'release'
    needs: [test]
    name: Test Build for x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nightly Toolchain
        run: |
          rustup toolchain install nightly
          rustup default nightly

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev
          cd ~ && git clone https://github.com/axboe/liburing && cd liburing && ./configure && make && sudo make install

      - name: Build
        run: RUSTFLAGS="-C target-feature=+crt-static" && cargo build --release

      - name: Send Discord build notification (Success)
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "🔨 x86_64 Test Build Complete",
                   "description": "Test build successful for `${{ github.repository }}` on `${{ github.ref_name }}`",
                   "color": 3447003,
                   "fields": [
                     {"name": "Target", "value": "x86_64-unknown-linux-gnu", "inline": true},
                     {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                     {"name": "Author", "value": "${{ github.actor }}", "inline": true}
                   ],
                   "timestamp": "'""$(date -u +%Y-%m-%dT%H:%M:%S.000Z)""'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send Discord build notification (Failure)
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "💥 x86_64 Test Build Failed",
                   "description": "Test build failed for `${{ github.repository }}` on `${{ github.ref_name }}`",
                   "color": 16711680,
                   "fields": [
                     {"name": "Target", "value": "x86_64-unknown-linux-gnu", "inline": true},
                     {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                     {"name": "Author", "value": "${{ github.actor }}", "inline": true}
                   ],
                   "timestamp": "'""$(date -u +%Y-%m-%dT%H:%M:%S.000Z)""'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

  build-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [test]
    name: Release Build for x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nightly Toolchain
        run: |
          rustup toolchain install nightly
          rustup default nightly

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev
          cd ~ && git clone https://github.com/axboe/liburing && cd liburing && ./configure && make && sudo make install

      - name: Build
        run: RUSTFLAGS="-C target-feature=+crt-static" && cargo build --release

      - name: Debug - List release directory
        run: |
          echo "Contents of target/release:"
          ls -la target/release/
          echo "Looking for tyto-db binary..."
          if [ -f target/release/tyto-db ]; then
            echo "✅ tyto-db binary found"
            file target/release/tyto-db
          else
            echo "❌ tyto-db binary not found"
            echo "Available binaries:"
            find target/release -type f -executable -not -name "*.so" -not -name ".*"
          fi

      - name: Package binary
        run: |
          if [ ! -f target/release/tyto-db ]; then
            echo "Error: tyto-db binary not found!"
            exit 1
          fi
          tar -czf tyto-db-x86_64-linux.tar.gz -C target/release tyto-db
          echo "Package created:"
          ls -la tyto-db-x86_64-linux.tar.gz

      - name: Upload to release
        run: |
          echo "Uploading to release ID: ${{ github.event.release.id }}"
          echo "Release tag: ${{ github.event.release.tag_name }}"
          
          RESPONSE=$(curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets?name=tyto-db-x86_64-linux.tar.gz" \
            --data-binary "@tyto-db-x86_64-linux.tar.gz" \
            -w "HTTP_CODE:%{http_code}")
          
          echo "Upload response: $RESPONSE"
          
          # Extract HTTP code
          HTTP_CODE=$(echo "$RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)
          if [ "$HTTP_CODE" != "201" ]; then
            echo "Upload failed with HTTP code: $HTTP_CODE"
            exit 1
          fi
          echo "✅ Upload successful!"

      - name: Send Discord build notification (Success)
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "🚀 x86_64 Release Built",
                   "description": "Binary `tyto-db-x86_64-linux.tar.gz` built and uploaded for release `${{ github.event.release.tag_name }}`",
                   "color": 3447003,
                   "fields": [
                     {"name": "Target", "value": "x86_64-unknown-linux-gnu", "inline": true},
                     {"name": "Release", "value": "${{ github.event.release.tag_name }}", "inline": true}
                   ],
                   "timestamp": "'""$(date -u +%Y-%m-%dT%H:%M:%S.000Z)""'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send Discord build notification (Failure)
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "💥 x86_64 Build Failed",
                   "description": "Failed to build binary for release `${{ github.event.release.tag_name }}`",
                   "color": 16711680,
                   "fields": [
                     {"name": "Target", "value": "x86_64-unknown-linux-gnu", "inline": true},
                     {"name": "Release", "value": "${{ github.event.release.tag_name }}", "inline": true}
                   ],
                   "timestamp": "'""$(date -u +%Y-%m-%dT%H:%M:%S.000Z)""'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
