name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install liburing-dev
      run: sudo apt-get update && sudo apt-get install -y liburing-dev
    
    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      id: tests
      run: |
        # Run tests and capture output
        if cargo test --verbose > test_output.txt 2>&1; then
          echo "tests_passed=true" >> $GITHUB_OUTPUT
        else
          echo "tests_passed=false" >> $GITHUB_OUTPUT
        fi
        # Also display the output
        cat test_output.txt
    
    # Send success notification
    - name: Send Discord notification (Success)
      if: steps.tests.outputs.tests_passed == 'true'
      run: |
        curl -H "Content-Type: application/json" \
             -d '{
               "embeds": [{
                 "title": "✅ Tests Passed",
                 "description": "All tests passed successfully for `'${{ github.repository }}'`",
                 "color": 65280,
                 "fields": [
                   {
                     "name": "Branch",
                     "value": "'${{ github.ref_name }}'",
                     "inline": true
                   },
                   {
                     "name": "Commit",
                     "value": "['${{ github.sha }}']('${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}')",
                     "inline": true
                   },
                   {
                     "name": "Author",
                     "value": "'${{ github.actor }}'",
                     "inline": true
                   }
                 ],
                 "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'"
               }]
             }' \
             ${{ secrets.DISCORD_WEBHOOK_URL }}
    
    # Send failure notification
    - name: Send Discord notification (Failure)
      if: steps.tests.outputs.tests_passed == 'false' || failure()
      run: |
        # Get the last few lines of test output for the notification
        tail -20 test_output.txt > short_output.txt 2>/dev/null || echo "No test output available" > short_output.txt
        TEST_OUTPUT=$(cat short_output.txt | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
        
        curl -H "Content-Type: application/json" \
             -d '{
               "embeds": [{
                 "title": "❌ Tests Failed",
                 "description": "Tests failed for `'${{ github.repository }}'`",
                 "color": 16711680,
                 "fields": [
                   {
                     "name": "Branch",
                     "value": "'${{ github.ref_name }}'",
                     "inline": true
                   },
                   {
                     "name": "Commit",
                     "value": "['${{ github.sha }}']('${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}')",
                     "inline": true
                   },
                   {
                     "name": "Author",
                     "value": "'${{ github.actor }}'",
                     "inline": true
                   },
                   {
                     "name": "Error Output",
                     "value": "```\n'"$TEST_OUTPUT"'\n```"
                   }
                 ],
                 "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'"
               }]
             }' \
             ${{ secrets.DISCORD_WEBHOOK_URL }}