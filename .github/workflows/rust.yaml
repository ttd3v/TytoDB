name: Build and Publish TytoDB

on:
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - i686-unknown-linux-gnu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
          profile: minimal
          
      - name: Install cross
        run: cargo install cross
        
      - name: Create Cross.toml for Linux dependencies
        run: |
          cat <<EOF > Cross.toml
          [target.aarch64-unknown-linux-gnu]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          
          [target.x86_64-unknown-linux-gnu]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          
          [target.armv7-unknown-linux-gnueabihf]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          
          [target.i686-unknown-linux-gnu]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends liburing-dev"]
          EOF
          
      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }}
        
      - name: Package the binary
        run: |
          mkdir -p dist
          if [ -f "target/${{ matrix.target }}/release/tytodb" ]; then
            cp "target/${{ matrix.target }}/release/tytodb" "dist/tytodb-${{ matrix.target }}"
          elif [ -f "target/${{ matrix.target }}/release/tytodb.exe" ]; then
            cp "target/${{ matrix.target }}/release/tytodb.exe" "dist/tytodb-${{ matrix.target }}.exe"
          else
            echo "Binary not found!"
            ls -la "target/${{ matrix.target }}/release/"
            exit 1
          fi
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tytodb-binary-${{ matrix.target }}
          path: dist/
          retention-days: 1

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-linux]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/tytodb-binary-*; do
            if [ -d "$dir" ]; then
              target_name=$(basename "$dir" | sed 's/tytodb-binary-//')
              echo "Processing target: $target_name"
              (cd "$dir" && tar -czf "../../release-assets/tytodb-${target_name}.tar.gz" *)
            fi
          done
          echo "Created assets:"
          ls -la release-assets/
        
      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true