[package]
name = "tyto-db"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
build = "build.rs"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
panic = "abort"

[dependencies]
serde = {version="1.0.219", features=["derive"]}
serde_yaml = "0.9"
futures = "0.3"
regex = "1.11.1"
aes-gcm = "0.10.3"
lazy_static = "1.5.0"
base64 = "0.22.1"
num_cpus = "1.16.0"
tytodb-client = {version="0.1.1",default-features = false, features=["thread"] }
falcotcp = {features=["thread"],default-features = false, version="0.1.3"}
blake3 = "1.8.2"
rand = "0.9.1"
bitvec = "1.0.1"
chrono = "0.4.41"
